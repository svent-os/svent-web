//
(() => {
  try {
    const classes = Components.classes;
    const interfaces = Components.interfaces;
    const io = classes["@mozilla.org/network/io-service;1"].getService(interfaces.nsIIOService);
    const preferences = classes["@mozilla.org/preferences-service;1"].getService(interfaces.nsIPrefBranch);
    preferences.setStringPref("browser.svent.bookmarks.status", "configuration loaded");
    const observers = classes["@mozilla.org/observer-service;1"].getService(interfaces.nsIObserverService);
    let initialized = false;
    observers.addObserver(window => {
      try {
        const loader = window?.ChromeUtils || ChromeUtils;
        const styles = classes["@mozilla.org/content/style-sheet-service;1"].getService(interfaces.nsIStyleSheetService);
        const css = '@-moz-document url("chrome://browser/content/browser.xhtml") { #import-button { display: none !important; } #PlacesToolbarItems > .bookmark-item { border-radius: 0 !important; box-shadow: none !important; border-color: transparent !important; } #PlacesToolbarItems > .bookmark-item:hover { outline: none !important; } }';
        const sheet = io.newURI("data:text/css;charset=UTF-8," + encodeURIComponent(css));
        if (!styles.sheetRegistered(sheet, styles.USER_SHEET)) styles.loadAndRegisterSheet(sheet, styles.USER_SHEET);
        try {
          window?.CustomizableUI?.removeWidgetFromArea("import-button");
        } catch (error) {
          Components.utils.reportError(error);
        }
        if (initialized) return;
        initialized = true;
        const PlacesUtils = window?.PlacesUtils || loader.importESModule("resource://gre/modules/PlacesUtils.sys.mjs", { global: "shared" }).PlacesUtils;
        const file = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
        file.initWithPath("/usr/share/svent/firefox/policies.json");
        const input = Components.classes["@mozilla.org/network/file-input-stream;1"].createInstance(Components.interfaces.nsIFileInputStream);
        input.init(file, 1, 0, 0);
        const stream = Components.classes["@mozilla.org/scriptableinputstream;1"].createInstance(Components.interfaces.nsIScriptableInputStream);
        stream.init(input);
        let configured;
        try {
          configured = JSON.parse(stream.read(stream.available())).policies.Bookmarks;
        } finally {
          stream.close();
        }
        const desired = new Map(configured.map(item => [io.newURI(item.URL).spec, item]));
        let running = false;
        let pending = false;
        async function synchronize() {
          pending = true;
          if (running) return;
          running = true;
          try {
            do {
              pending = false;
              const bookmarks = [];
              await PlacesUtils.bookmarks.fetch({ guidPrefix: "PolB-" }, item => bookmarks.push(item));
              for (const bookmark of bookmarks) {
                const item = desired.get(bookmark.url.href);
                if (!item) continue;
                if (bookmark.title !== item.Title) {
                  await PlacesUtils.bookmarks.update({ guid: bookmark.guid, title: item.Title });
                }
                await PlacesUtils.favicons.setFaviconForPage(
                  io.newURI(item.URL),
                  io.newURI("fake-favicon-uri:" + io.newURI(item.URL).spec),
                  io.newURI(item.Favicon)
                );
              }
              let index = 0;
              for (const [url] of desired) {
                const bookmark = bookmarks.find(item => item.url.href === url);
                if (!bookmark) continue;
                if (bookmark.parentGuid !== PlacesUtils.bookmarks.toolbarGuid || bookmark.index !== index) {
                  await PlacesUtils.bookmarks.update({ guid: bookmark.guid, parentGuid: PlacesUtils.bookmarks.toolbarGuid, index });
                }
                index++;
              }
              preferences.setStringPref("browser.svent.bookmarks.status", index === desired.size ? "ready 0.1.6" : "waiting for policy bookmarks");
            } while (pending);
          } catch (error) {
            preferences.setStringPref("browser.svent.bookmarks.status", "error: " + error);
            Components.utils.reportError(error);
          } finally {
            running = false;
          }
        }
        PlacesUtils.observers.addListener(["bookmark-added"], synchronize);
        synchronize();
      } catch (error) {
        preferences.setStringPref("browser.svent.bookmarks.status", "error: " + error);
        Components.utils.reportError(error);
      }
    }, "browser-delayed-startup-finished");
  } catch (error) {
    Components.utils.reportError(error);
  }
})();
