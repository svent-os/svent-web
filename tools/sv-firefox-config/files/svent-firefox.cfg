//
(() => {
  try {
    let initialized = false;
    Services.obs.addObserver(() => {
      try {
        const { CustomizableUI } = ChromeUtils.importESModule("resource:///modules/CustomizableUI.sys.mjs");
        CustomizableUI.removeWidgetFromArea("import-button");
        if (initialized) return;
        initialized = true;
        const { PlacesUtils } = ChromeUtils.importESModule("resource://gre/modules/PlacesUtils.sys.mjs");
        const file = Components.classes["@mozilla.org/file/local;1"].createInstance(Components.interfaces.nsIFile);
        file.initWithPath("/usr/share/svent/firefox/policies.json");
        const input = Components.classes["@mozilla.org/network/file-input-stream;1"].createInstance(Components.interfaces.nsIFileInputStream);
        input.init(file, 1, 0, 0);
        const stream = Components.classes["@mozilla.org/scriptableinputstream;1"].createInstance(Components.interfaces.nsIScriptableInputStream);
        stream.init(input);
        let configured;
        try {
          configured = JSON.parse(stream.read(stream.available())).policies.Bookmarks;
        } finally {
          stream.close();
        }
        const desired = new Map(configured.map(item => [Services.io.newURI(item.URL).spec, item]));
        let running = false;
        let pending = false;
        async function synchronize() {
          pending = true;
          if (running) return;
          running = true;
          try {
            do {
              pending = false;
              const bookmarks = [];
              await PlacesUtils.bookmarks.fetch({ guidPrefix: "PolB-" }, item => bookmarks.push(item));
              for (const bookmark of bookmarks) {
                const item = desired.get(bookmark.url.href);
                if (!item) continue;
                if (bookmark.title !== item.Title) {
                  await PlacesUtils.bookmarks.update({ guid: bookmark.guid, title: item.Title });
                }
                await PlacesUtils.favicons.setFaviconForPage(
                  Services.io.newURI(item.URL),
                  Services.io.newURI("fake-favicon-uri:" + Services.io.newURI(item.URL).spec),
                  Services.io.newURI(item.Favicon)
                );
              }
            } while (pending);
          } catch (error) {
            Components.utils.reportError(error);
          } finally {
            running = false;
          }
        }
        PlacesUtils.observers.addListener(["bookmark-added"], synchronize);
        synchronize();
      } catch (error) {
        Components.utils.reportError(error);
      }
    }, "browser-delayed-startup-finished");
  } catch (error) {
    Components.utils.reportError(error);
  }
})();
